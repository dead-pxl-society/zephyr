[package]
name = "zephyr"
version = "0.1.0"
description = "P2P file tranfer, delightful"
authors = ["Carlos Diez"]
license = "Apache-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zephyr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = " 0.1.88"
anyhow = "1"
dashmap = "6.1.0"
futures-buffered = "0.2.11"
hex = "0.4"
hostname = "0.3"
infer = "0.19.0"
iroh-blobs = "0.103.1"
iroh-gossip = "0.101"
iroh = "1.4.1"
iroh-mdns-address-lookup = "0.4.0"
iroh-tickets = "1.0.0"
iroh-util = "0.6.0"
irpc = "0.17.0"
n0-future = "0.3.2"
num_cpus = "1.16.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
surrealdb = { version = "3.2.3", features = ["kv-rocksdb"] }
surrealitos = { git = "https://github.com/litsdm/surrealitos.git" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
thiserror = "2.0.12"
tokio = { version = "1.34.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io-util", "io"] }
walkdir = "2"
window-vibrancy = "0.7.1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
zephyr-notify = { git = "https://github.com/dead-pxl-society/zephyr-notify.git" }
xxhash-rust = { version = "0.8.15", features = ["xxh3", "const_xxh3"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
n0-error = "1.0.0"
clipboard-rs = { version = "0.3.5", default-features = false }
chacha20poly1305 = "0.11.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
	"Win32_Foundation",
	"Win32_System_Com",
	"Win32_System_Ole",
	"Win32_System_Variant",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }
